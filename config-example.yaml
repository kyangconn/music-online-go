server:
  # 留空表示监听所有网络接口；也可设为 127.0.0.1 或具体 IP。
  listen_address: ""
  port: "8080"
  mode: "release"
  # read/write 为 0 时不限制完整上传或媒体流的持续时间。
  read_header_timeout: 10
  read_timeout: 0
  write_timeout: 0
  idle_timeout: 60
  shutdown_timeout: 15
  readiness_timeout: 2
  upload_dir: "uploads"
  log_file: ""
  max_json_body_size_mb: 1
  max_audio_size_mb: 200
  max_cover_size_mb: 10
  allowed_origins: []
  # 只填直接连接到本服务的反向代理 IP/CIDR；默认不信任代理头。
  trusted_proxies: []

database:
  type: "sqlite"
  path: "music.db"
  host: ""
  port: "5432"
  user: ""
  password: ""
  name: ""
  sslmode: "prefer"
  log_level: "auto"
  connect_timeout_seconds: 10
  # 0 表示按数据库类型自动选择；SQLite 默认 1/1，PostgreSQL 默认 25/5。
  max_open_connections: 0
  max_idle_connections: 0
  connection_max_lifetime_minutes: 60
  connection_max_idle_time_minutes: 10

jwt:
  # 所有模式至少需要 32 个 UTF-8 字节；release/test 还会拒绝此占位值。
  secret: "your-secret-key-change-in-production"
  # 短期 access token 有效期（分钟）。access token 只存于前端内存。
  access_token_ttl_minutes: 15
  # 服务端会话（refresh token）有效期（天）；到期后必须重新登录。
  refresh_token_ttl_days: 30
  # refresh token 通过 httpOnly + SameSite=Strict cookie 下发；
  # 仅在 HTTPS 部署时开启 Secure 标志。
  refresh_cookie_secure: false

access:
  # public: 匿名可浏览和播放；authenticated: 列表、详情、封面和音频都需要登录。
  library_mode: "public"
  # open: 允许公开注册；admin: 仅管理员可从管理面板创建用户。
  registration_mode: "open"
  # 私有音乐库中签名媒体 URL 的有效期。前端会在播放前自动续签。
  media_url_ttl_minutes: 60

library:
  # 周期性检查媒体根健康；0 关闭后台检查，管理员仍可手动探测。
  health_check_interval_seconds: 60
  scanner:
    # 关闭后保留目录与扫描历史，但管理员不能创建新的扫描任务。
    enabled: true
    # 扫描器独立于浏览器上传限制；用于跳过异常大的来源文件。
    max_file_size_mb: 2048
    # 进入第三方标签解析器前允许的元数据上限；硬上限为 64 MiB。
    max_tag_size_mb: 16
    # 跳过仍可能在写入中的新文件，避免索引不完整的 NFS/同步文件。
    min_file_age_seconds: 30
    # 即使大小和修改时间不变，也按周期重新校验内容哈希；0 关闭周期复核。
    hash_recheck_hours: 168
    # 网络存储离线时使用有上限的指数退避，不会用 ping 代替文件系统证据。
    retry_max_attempts: 5
    retry_initial_seconds: 30
    retry_max_seconds: 900

classification:
  # 本地标签规则层；关闭后不再生成或更新预设分类，但不影响音乐库和播放。
  enabled: true
  # 仅在 HTTP analyzer 已配置时启用；上传/导入提交成功后只追加后台任务。
  analyze_on_upload: false
  # 最高分达到阈值且与第二名差距足够时才自动归类，否则保留待确认/未归类。
  auto_threshold: 0.65
  review_margin: 0.12
  # 预留给真实曲库校准的全局倍率，范围 (0, 2]；规则内原始证据仍单独保存。
  weights:
    calm_flow: 1.0
    kinetic_pulse: 1.0
    cosmic_drift: 1.0
    bass_impact: 1.0
  analyzer:
    # disabled 保持纯 Go 单体部署；http 通过受鉴权的音频字节流调用可选分析器。
    mode: "disabled"
    endpoint: ""
    token: ""
    id: ""
    version: ""
    model_version: ""
    timeout_seconds: 300
    concurrency: 1
    queue_limit: 1000
    max_file_size_mb: 2048
    max_duration_seconds: 1800
    retry_max_attempts: 3
    retry_initial_seconds: 30
    retry_max_seconds: 900

integrations:
  musicbee:
    # 两项需同时设置。启用后 POST /api/v1/track/submit 仅接受此 scoped Bearer token。
    submit_token: ""
    submit_username: ""

metrics:
  enabled: false
  token: ""

rate_limit:
  enabled: true
  global_requests_per_second: 20
  global_burst: 50
  auth_requests_per_second: 1
  auth_burst: 5

logging:
  level: "info"
  access_log: true
  max_size_mb: 50
  max_backups: 3
  max_age_days: 28
  compress: true
  local_time: true

admin:
  bootstrap:
    enabled: false
    username: ""
    email: ""
    password: ""
    full_name: "Administrator"
    reset_password: false
