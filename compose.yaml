name: ${COMPOSE_PROJECT_NAME:-music-online}

services:
  app:
    image: ${MUSIC_ONLINE_IMAGE:-music-online-go:local}
    build:
      context: .
      args:
        VERSION: ${VERSION:-dev}
        VCS_REF: ${VCS_REF:-unknown}
        BUILD_DATE: ${BUILD_DATE:-1970-01-01T00:00:00Z}
    restart: ${RESTART_POLICY:-unless-stopped}
    init: true
    read_only: ${READ_ONLY_ROOTFS:-true}
    # 默认发布到宿主机 127.0.0.1:8080，本机可直接访问；对外开放改成 APP_BIND_ADDRESS=0.0.0.0。
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8080}:8080"
    volumes:
      # 先 `cp config-docker-example.yaml config.yaml` 并填好 jwt.secret，再启动。
      - type: bind
        source: ${CONFIG_FILE:-./config.yaml}
        target: /etc/music-online/config.yaml
        read_only: true
        bind:
          create_host_path: false
      - "${DATA_PATH:-music-online-data}:/data"
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=${TMPFS_SIZE:-256m},mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: ${STOP_GRACE_PERIOD:-30s}
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -T 3 --spider http://127.0.0.1:8080/ready || exit 1
      interval: ${HEALTHCHECK_INTERVAL:-30s}
      timeout: ${HEALTHCHECK_TIMEOUT:-5s}
      start_period: ${HEALTHCHECK_START_PERIOD:-15s}
      retries: ${HEALTHCHECK_RETRIES:-3}

volumes:
  music-online-data:
    name: ${DATA_VOLUME_NAME:-music-online-data}
