# 可选：额外启动一个 PostgreSQL 容器。
# 用法：POSTGRES_PASSWORD='强密码' docker compose -f compose.yaml -f compose.postgres.yaml up -d --build
services:
  app:
    environment:
      DATABASE_TYPE: postgres
      DATABASE_HOST: postgres
      DATABASE_PORT: "${POSTGRES_PORT:-5432}"
      DATABASE_USER: "${POSTGRES_USER:-music_online}"
      DATABASE_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}"
      DATABASE_NAME: "${POSTGRES_DB:-music_online}"
      DATABASE_SSLMODE: "${DATABASE_SSLMODE:-disable}"
    depends_on:
      postgres:
        condition: service_healthy
        restart: true

  postgres:
    image: "${POSTGRES_IMAGE:-postgres:18-alpine3.23}"
    restart: "${RESTART_POLICY:-unless-stopped}"
    init: true
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-music_online}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB:-music_online}"
    volumes:
      # PostgreSQL 18+ stores data in a major-version subdirectory so that
      # pg_upgrade --link can operate without crossing a mount boundary.
      - "${POSTGRES_DATA_PATH:-music-online-postgres-data}:/var/lib/postgresql"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5

volumes:
  music-online-postgres-data:
    name: ${POSTGRES_DATA_VOLUME_NAME:-music-online-postgres-data}
