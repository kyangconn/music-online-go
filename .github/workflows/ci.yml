name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: music
          POSTGRES_PASSWORD: music
          POSTGRES_DB: music
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U music"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      GO_VERSION: "1.22"
      NODE_VERSION: "20"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend deps
        working-directory: web
        run: npm ci

      - name: Build frontend
        working-directory: web
        run: npm run build

      - name: Go mod download
        run: go mod download

      - name: Go test
        run: go test ./...

      - name: Go build
        run: go build -v ./cmd/server
