server:
  listen_address: "0.0.0.0"
  port: "8080"
  mode: "release"
  read_header_timeout: 10
  read_timeout: 0
  write_timeout: 0
  idle_timeout: 60
  shutdown_timeout: 15
  readiness_timeout: 2
  upload_dir: "/data/uploads"
  log_file: ""
  max_json_body_size_mb: 1
  max_audio_size_mb: 200
  max_cover_size_mb: 10
  allowed_origins: []
  trusted_proxies: []

database:
  type: "sqlite"
  path: "/data/music.db"
  host: ""
  port: "5432"
  user: ""
  password: ""
  name: ""
  sslmode: "prefer"
  log_level: "auto"
  connect_timeout_seconds: 10
  max_open_connections: 0
  max_idle_connections: 0
  connection_max_lifetime_minutes: 60
  connection_max_idle_time_minutes: 10

# Inject a JWT_SECRET of at least 32 UTF-8 bytes at runtime; never store it here.
jwt:
  secret: ""
  expire_hour: 24

access:
  library_mode: "public"
  registration_mode: "open"
  media_url_ttl_minutes: 60

library:
  health_check_interval_seconds: 60
  scanner:
    enabled: true
    max_file_size_mb: 2048
    max_tag_size_mb: 16
    min_file_age_seconds: 30
    hash_recheck_hours: 168
    retry_max_attempts: 5
    retry_initial_seconds: 30
    retry_max_seconds: 900

integrations:
  musicbee:
    # Prefer INTEGRATIONS_MUSICBEE_SUBMIT_TOKEN or its _FILE form at runtime.
    submit_token: ""
    submit_username: ""

metrics:
  enabled: false
  token: ""

admin:
  bootstrap:
    enabled: false
    username: ""
    email: ""
    password: ""
    full_name: "Administrator"
    reset_password: false

rate_limit:
  enabled: true
  global_requests_per_second: 20
  global_burst: 50
  auth_requests_per_second: 1
  auth_burst: 5

logging:
  level: "info"
  access_log: true
  max_size_mb: 50
  max_backups: 3
  max_age_days: 28
  compress: true
  local_time: true
